# Plugin coordinates. `pluginGroup`/`pluginVersion` feed build.gradle.kts and plugin.xml.
pluginGroup = com.tangent
pluginVersion = 0.1.0

# Target IDE. `rider("2024.2")` in build.gradle.kts reads this.
# 242 is the branch number of 2024.2; untilBuild is left open on purpose.
platformType = RD
platformVersion = 2024.2
pluginSinceBuild = 242

# Bundled plugins this plugin depends on (see plugin.xml <depends>).
platformBundledPlugins = org.jetbrains.plugins.textmate

# The IntelliJ Platform ships its own Kotlin stdlib; do not bundle a second copy.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.caching = true
