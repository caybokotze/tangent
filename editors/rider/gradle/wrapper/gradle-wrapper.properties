# NOTE: gradle/wrapper/gradle-wrapper.jar and the `gradlew`/`gradlew.bat` scripts are
# deliberately NOT committed here (no JDK/Gradle on the machine this was authored on).
# With a local Gradle >= 8.5 installed, run once from editors/rider/:
#
#     gradle wrapper --gradle-version 8.10.2
#
# which regenerates this file plus the jar and both launcher scripts.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
