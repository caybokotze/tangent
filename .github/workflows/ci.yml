name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Tangent.slnx
      - name: restore the sample (the CLI tests load it with MSBuildWorkspace, which needs it restored)
        run: dotnet restore samples/Orders/Orders.slnx
      - run: dotnet build Tangent.slnx -c Release --no-restore
      - run: dotnet test Tangent.slnx -c Release --no-build --logger "trx"
      - run: dotnet pack Tangent.slnx -c Release --no-build
      - run: dotnet build samples/Orders/Orders.slnx -c Release
      - name: tangent check (sample; exit 1 is expected because the sample contains deliberate violations)
        run: |
          set +e
          dotnet run --project src/Tangent.Cli -c Release --no-build -- check samples/Orders/Orders.slnx --sarif artifacts/orders.sarif
          code=$?
          if [ "$code" -gt 1 ]; then echo "tangent check failed with exit code $code"; exit "$code"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: package (vsce runs the compile first)
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
